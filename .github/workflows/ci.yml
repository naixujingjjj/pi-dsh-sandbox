name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      - run: npm run verify
      - run: npm run test:integration
      - run: npm run test:register
      - run: npm run test:pi
      - run: npm run test:cli
      - run: npm run test:failure
      - run: npm run test:pack
      - run: npm run pack
      - run: npm run check:package
      - uses: actions/upload-artifact@v7
        with:
          name: pi-dsh-sandbox
          path: |
            ../pi-dsh-sandbox-pkg/*.tgz
            ../pi-dsh-sandbox-pkg/*.sha256
            ../pi-dsh-sandbox-pkg/*.manifest.json
